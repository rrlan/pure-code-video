<body>
  <div id="stage-wrap">
    <canvas id="main-canvas" width="1920" height="1080"></canvas>
  </div>

  <div id="controls">
    <button id="play-btn">PLAY / PAUSE</button>
    <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" />
    <span id="time-label">00.00s / 15.00s</span>
  </div>

<script>
/*
 * BEAT SHEET — 128 BPM (1 beat = 0.46875s, 8 bars = 32 beats = 15.00s)
 * -----------------------------------------------------------------------------------------
 * 0.00s - 1.875s (Beats 00-04) | SCENE 01: SPARK OPEN      | Spark ignites -> horizon wave -> vertical flood (#FF4F1A) | Sub pulse + laser sweep + flood boom
 * 1.875s- 3.750s (Beats 04-08) | SCENE 02: BRAND SLAM      | "CODE IS CINEMA." mask slam + serif manifesto -> dot zoom | Heavy kick + chord stab + riser
 * 3.750s- 6.563s (Beats 08-14) | SCENE 03: KINETIC TRIPLET | 3x 2-beat swaps: SPRING(t) / 3D MESH / 48kHz SYNTH        | Snappy beat chops + tonal blips
 * 6.563s- 9.375s (Beats 14-20) | SCENE 04: 3D VOXEL WAVE   | 13x13 perspective voxel matrix rippling on beat + orbit   | Arp bassline + Reese sub + pluck
 * 9.375s-11.719s (Beats 20-25) | SCENE 05: COMPILER CARD   | 3D tilted IDE + live seek(t) code + cursor click VERIFIED | UI clicks + shimmer + chime
 * 11.719s-13.125s(Beats 25-28) | SCENE 06: PROOF TELEMETRY | 900 FRAMES / 0 AI IMAGES / 100% DETERMINISTIC -> collapse | Rapid riser + data ticks + implosion
 * 13.125s-15.000s(Beats 28-32) | SCENE 07: END CARD        | Ring pulse -> ARGON . STUDIO + pure-code manifesto        | Deep sub drop + warm synth pad tail
 */

window.VIDEO = { w: 1920, h: 1080, duration: 15.0 };

const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render-mode');

function fitStage() {
  if (isRender) return;
  const wrap = document.getElementById('stage-wrap');
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  wrap.style.transform = `scale(${scale})`;
  wrap.style.left = `${(window.innerWidth - 1920 * scale) * 0.5}px`;
  wrap.style.top = `${(window.innerHeight - 1080 * scale) * 0.5}px`;
}
window.addEventListener('resize', fitStage);
fitStage();

// --- DETERMINISTIC MATH & ANIMATION HELPERS ---
function spring(t, w = 14, z = 0.72) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOutQuart = x => { x = clamp(x); return 1 - Math.pow(1 - x, 4); };
const easeInQuart = x => { x = clamp(x); return x * x * x * x; };
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);

const BPM = 128;
const BEAT = 60 / BPM; // 0.46875s

const PAL = {
  ink: '#0B0B10',
  accent: '#FF4F1A',
  cream: '#EDEBE4',
  blue: '#2F47FF',
  cyan: '#00F0FF',
  lime: '#C6FF33',
  white: '#FFFFFF',
  muted: '#7B7E8C'
};

const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');

// Pre-bake 4 seeded film grain tiles (240x135 scaled up) for fast deterministic texture
const grainTiles = Array.from({ length: 4 }, (_, idx) => {
  const gc = document.createElement('canvas');
  gc.width = 320;
  gc.height = 180;
  const gctx = gc.getContext('2d');
  const img = gctx.createImageData(320, 180);
  const r = rng(1000 + idx * 777);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = (r() * 255) | 0;
    img.data[i] = v;
    img.data[i + 1] = v;
    img.data[i + 2] = v;
    img.data[i + 3] = 16;
  }
  gctx.putImageData(img, 0, 0);
  return gc;
});

// Pre-bake 3D icosahedron/sphere vertices for Scene 03B
const meshVerts = [];
const meshEdges = [];
{
  const rings = 8, segs = 14;
  for (let i = 0; i <= rings; i++) {
    const v = i / rings;
    const phi = v * Math.PI;
    for (let j = 0; j < segs; j++) {
      const u = j / segs;
      const theta = u * Math.PI * 2;
      meshVerts.push([
        Math.sin(phi) * Math.cos(theta),
        Math.cos(phi),
        Math.sin(phi) * Math.sin(theta)
      ]);
      const curr = i * segs + j;
      const nextJ = i * segs + ((j + 1) % segs);
      if (i > 0 && i < rings) meshEdges.push([curr, nextJ]);
      if (i < rings) meshEdges.push([curr, (i + 1) * segs + j]);
    }
  }
}

// Helper: Draw rounded rectangle
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

// Helper: Draw subtle background grid
function drawGrid(ctx, color, spacing = 80, offsetX = 0, offsetY = 0) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = (offsetX % spacing); x < 1920; x += spacing) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, 1080);
  }
  for (let y = (offsetY % spacing); y < 1080; y += spacing) {
    ctx.moveTo(0, y);
    ctx.lineTo(1920, y);
  }
  ctx.stroke();
  ctx.restore();
}

// Helper: Draw radial vignette + seeded grain
function drawPostProcess(ctx, t, darkVignette = true) {
  ctx.save();
  const grad = ctx.createRadialGradient(960, 540, 420, 960, 540, 1180);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, darkVignette ? 'rgba(5,5,9,0.48)' : 'rgba(11,11,16,0.18)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1920, 1080);

  const tileIdx = Math.floor(t * 24) % grainTiles.length;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(grainTiles[tileIdx], 0, 0, 1920, 1080);
  ctx.restore();
}

// Helper: HUD Viewfinder Frame on every scene
function drawHUD(ctx, t, sceneIndex, categoryLabel, fgColor) {
  ctx.save();
  ctx.strokeStyle = fgColor;
  ctx.fillStyle = fgColor;
  ctx.globalAlpha = 0.62;
  ctx.lineWidth = 1.5;

  const m = 44, bl = 22;
  // 4 corner brackets
  // TL
  ctx.beginPath();
  ctx.moveTo(m, m + bl); ctx.lineTo(m, m); ctx.lineTo(m + bl, m);
  // TR
  ctx.moveTo(1920 - m - bl, m); ctx.lineTo(1920 - m, m); ctx.lineTo(1920 - m, m + bl);
  // BL
  ctx.moveTo(m, 1080 - m - bl); ctx.lineTo(m, 1080 - m); ctx.lineTo(m + bl, 1080 - m);
  // BR
  ctx.moveTo(1920 - m - bl, 1080 - m); ctx.lineTo(1920 - m, 1080 - m); ctx.lineTo(1920 - m, 1080 - m - bl);
  ctx.stroke();

  // Top-left & Top-right labels
  ctx.font = "600 14px 'JetBrainsMono', monospace";
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText('ARGON // PURE-CODE MOTION ENGINE  [NO IMAGE MODEL]', m + 14, m + 8);

  ctx.textAlign = 'right';
  const beatNum = Math.floor(t / BEAT) + 1;
  ctx.fillText(`BPM 128 // BEAT ${String(beatNum).padStart(2, '0')}.32 // SCENE 0${sceneIndex} / 07`, 1920 - m - 14, m + 8);

  // Bottom-left category
  ctx.textBaseline = 'bottom';
  ctx.textAlign = 'left';
  ctx.fillText(`MODE :: ${categoryLabel}`, m + 14, 1080 - m - 8);

  // Bottom-right timecode + pulsing beat indicator
  const sec = Math.floor(t);
  const frm = Math.floor((t - sec) * 60);
  const tc = `00:00:${String(sec).padStart(2, '0')}:${String(frm).padStart(2, '0')}  [1920×1080 @ 60FPS]`;
  ctx.textAlign = 'right';
  ctx.fillText(tc, 1920 - m - 34, 1080 - m - 8);

  // Beat pulse dot
  const beatPhase = (t % BEAT) / BEAT;
  ctx.globalAlpha = 0.9 - 0.5 * beatPhase;
  ctx.fillStyle = PAL.accent;
  ctx.beginPath();
  ctx.arc(1920 - m - 18, 1080 - m - 15, 5 + 2 * (1 - beatPhase), 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ============================================================================
// SCENE 01 (0.00s - 1.875s): SPARK OPEN -> LASER HORIZON -> VERTICAL FLOOD
// ============================================================================
function renderScene01(ctx, t) {
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(0, 0, 1920, 1080);
  drawGrid(ctx, 'rgba(237,235,228,0.05)', 80, -t * 40, 0);

  // Center coordinates reticle
  const sparkP = spring(t - 0.04, 18, 0.65);
  const lineP = spring(t - BEAT, 16, 0.72); // stretches at Beat 1 (0.46875s)
  const floodP = easeInQuart(seg(t, BEAT * 3, BEAT * 4)); // floods from Beat 3 to Beat 4 (1.406s -> 1.875s)

  // Concentric radar rings around center
  ctx.save();
  ctx.translate(960, 540);
  for (let i = 1; i <= 3; i++) {
    const rp = clamp((t - 0.05 * i) / 1.2);
    ctx.strokeStyle = `rgba(255, 79, 26, ${(1 - rp) * 0.45})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, rp * 260 * i, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Horizontal laser horizon line with harmonic wave
  const halfW = lerp(0, 960, lineP);
  const floodH = lerp(3, 1080, floodP);

  if (floodP < 0.05) {
    // Draw oscillating mathematical wave along the horizon line
    ctx.strokeStyle = PAL.accent;
    ctx.lineWidth = 4;
    ctx.beginPath();
    const wobbleAmp = Math.sin(seg(t, BEAT, BEAT * 3) * Math.PI) * 42 * Math.exp(-3 * Math.max(0, t - 1.0));
    for (let x = -halfW; x <= halfW; x += 8) {
      const env = Math.cos((x / Math.max(1, halfW)) * Math.PI * 0.5);
      const y = Math.sin(x * 0.025 - t * 28) * wobbleAmp * env;
      if (x === -halfW) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  } else {
    // Expanding vertical flood bar -> becomes Scene 02 background!
    ctx.fillStyle = PAL.accent;
    ctx.fillRect(-halfW, -floodH * 0.5, halfW * 2, floodH);
  }

  // Center spark diamond
  if (floodP < 0.6) {
    const s = 14 * sparkP * (1 + 0.25 * Math.sin(t * 26));
    ctx.fillStyle = PAL.cream;
    ctx.save();
    ctx.rotate(Math.PI / 4 + t * 2.5);
    ctx.fillRect(-s, -s, s * 2, s * 2);
    ctx.restore();
  }

  // Mono technical callouts above & below the horizon line
  if (t > 0.15 && floodP < 0.75) {
    const textAlpha = clamp((t - 0.15) / 0.2) * (1 - floodP * 1.3);
    ctx.globalAlpha = clamp(textAlpha);
    ctx.fillStyle = PAL.cream;
    ctx.font = "700 16px 'JetBrainsMono', monospace";
    ctx.textAlign = 'center';
    ctx.fillText('INIT // window.seek(t) -> DETERMINISTIC FRAME SYNTHESIS', 0, -54);

    ctx.fillStyle = PAL.accent;
    ctx.font = "500 15px 'JetBrainsMono', 'PingFang SC', monospace";
    ctx.fillText(`f(x, t) = A·sin(kx - ωt)·e^(-ζωt)   [纯代码实时渲染 · 零生图模型]`, 0, 68);
  }
  ctx.restore();

  drawHUD(ctx, t, 1, 'SPARK_IGNITION // WAVE_HORIZON', floodP > 0.5 ? PAL.ink : PAL.cream);
}

// ============================================================================
// SCENE 02 (1.875s - 3.750s): BRAND SLAM ("CODE IS CINEMA.") -> DOT DETACH
// ============================================================================
function renderScene02(ctx, t) {
  const lt = t - 1.875; // 0..1.875
  // Starts on the #FF4F1A flood from Scene 01, then slams a crisp dark stage card at beat 4.5
  ctx.fillStyle = PAL.accent;
  ctx.fillRect(0, 0, 1920, 1080);

  // Dark inner architectural frame expands with snappy spring
  const panelP = spring(lt - 0.08, 18, 0.76);
  const insetX = lerp(960, 76, panelP);
  const insetY = lerp(540, 76, panelP);
  ctx.fillStyle = PAL.ink;
  roundRect(ctx, insetX, insetY, 1920 - insetX * 2, 1080 - insetY * 2, 20);
  ctx.fill();

  drawGrid(ctx, 'rgba(237,235,228,0.05)', 64, 0, 0);

  // Top kicker badge
  const kickP = spring(lt - 0.12, 18, 0.78);
  ctx.save();
  ctx.translate(960, 250 + (1 - kickP) * 40);
  ctx.globalAlpha = clamp(kickP);
  ctx.fillStyle = 'rgba(255, 79, 26, 0.15)';
  ctx.strokeStyle = PAL.accent;
  ctx.lineWidth = 1.5;
  roundRect(ctx, -310, -22, 620, 44, 999);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = PAL.accent;
  ctx.font = "700 15px 'JetBrainsMono', 'PingFang SC', monospace";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('0% AI DIFFUSION  ·  100% EXECUTABLE CODE  ·  帧帧由数学驱动', 0, 1);
  ctx.restore();

  // Giant masked kinetic slam: "CODE IS" and "CINEMA"
  const words = [
    { text: 'CODE IS', y: 430, delay: 0.16, color: PAL.cream, size: 168 },
    { text: 'CINEMA', y: 605, delay: 0.34, color: PAL.accent, size: 184 }
  ];

  words.forEach(w => {
    const wp = spring(lt - w.delay, 19, 0.68);
    ctx.save();
    ctx.beginPath();
    ctx.rect(120, w.y - w.size * 0.62, 1680, w.size * 1.18);
    ctx.clip();
    ctx.translate(930, w.y + (1 - wp) * (w.size * 1.05));
    ctx.fillStyle = w.color;
    ctx.font = `900 ${w.size}px 'ArchivoBlack', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(w.text, 0, 0);
    ctx.restore();
  });

  // Italic serif human manifesto below
  const subP = spring(lt - 0.56, 15, 0.8);
  ctx.save();
  ctx.globalAlpha = clamp(subP);
  ctx.translate(960, 765 + (1 - subP) * 28);
  ctx.fillStyle = PAL.cream;
  ctx.font = "italic 48px 'InstrumentSerif', serif";
  ctx.textAlign = 'center';
  ctx.fillText('Every pixel computed from pure functions, physics & shaders.', 0, 0);

  ctx.fillStyle = PAL.muted;
  ctx.font = "500 22px 'PingFang SC', 'Hiragino Sans GB', sans-serif";
  ctx.fillText('不调用任何生图大模型 · 用 DOM / Canvas / WebAudio 实时合成视听', 0, 48);
  ctx.restore();

  // The period dot next to "CINEMA." detaches at Beat 7 (lt = 1.406s) and grows into Scene 03's cream background!
  const dotAppear = spring(lt - 0.42, 20, 0.6);
  const dotExpand = easeInQuart(seg(lt, 1.38, 1.875));
  const dotX = lerp(1365, 960, dotExpand);
  const dotY = lerp(638, 540, dotExpand);
  const dotR = lerp(22 * dotAppear, 1250, dotExpand);

  ctx.save();
  ctx.fillStyle = PAL.cream;
  ctx.beginPath();
  ctx.arc(dotX, dotY, Math.max(0, dotR), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  drawHUD(ctx, t, 2, 'KINETIC_IDENTITY // MASK_SLAM', dotExpand > 0.55 ? PAL.ink : PAL.cream);
}

// ============================================================================
// SCENE 03 (3.750s - 6.5625s): KINETIC TRIPLET (3 x 2-BEAT MANIFESTO SWAPS)
//   3A (3.750 - 4.6875): SPRING PHYSICS on Cream (#EDEBE4)
//   3B (4.6875 - 5.625): 3D MESH PROJECTION on Ink (#0B0B10)
//   3C (5.625 - 6.5625): 48kHz WEB AUDIO SYNTH on Electric Blue (#2F47FF)
// ============================================================================
function renderScene03(ctx, t) {
  const lt = t - 3.75; // 0 .. 2.8125 (6 beats total)
  const twoBeats = BEAT * 2; // 0.9375s

  if (lt < twoBeats) {
    // --- 3A: SPRING PHYSICS ON CREAM ---
    const st = lt;
    ctx.fillStyle = PAL.cream;
    ctx.fillRect(0, 0, 1920, 1080);
    drawGrid(ctx, 'rgba(11,11,16,0.06)', 80, 0, 0);

    const enter = spring(st, 22, 0.66);
    ctx.save();
    ctx.translate(960 + (1 - enter) * -180, 230);
    ctx.fillStyle = PAL.ink;
    ctx.font = "900 132px 'ArchivoBlack', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText('01 / SPRING MATH', 0, 0);
    ctx.font = "700 24px 'JetBrainsMono', 'PingFang SC', monospace";
    ctx.fillStyle = PAL.accent;
    ctx.fillText('y(t) = 1 - e^(-ζωt) · [cos(ωd·t) + (ζω/ωd)sin(ωd·t)]   // 阻尼弹簧物理曲线', 0, 62);
    ctx.restore();

    // Live interactive damped spring graph box
    ctx.save();
    ctx.translate(220, 360);
    ctx.fillStyle = PAL.ink;
    roundRect(ctx, 0, 0, 1480, 540, 24);
    ctx.fill();

    // Target line y = 1.0
    const gy0 = 430, gy1 = 150;
    ctx.strokeStyle = 'rgba(237,235,228,0.22)';
    ctx.setLineDash([8, 8]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(80, gy1);
    ctx.lineTo(1400, gy1);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw spring response curve up to current progress
    const drawProg = clamp(st / (twoBeats * 0.85));
    ctx.strokeStyle = PAL.accent;
    ctx.lineWidth = 6;
    ctx.beginPath();
    const maxX = 1320 * drawProg;
    let tipX = 80, tipY = gy0;
    for (let x = 0; x <= maxX; x += 4) {
      const simT = (x / 1320) * 0.75;
      const val = spring(simT, 16, 0.42);
      const px = 80 + x;
      const py = lerp(gy0, gy1, val);
      if (x === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
      tipX = px; tipY = py;
    }
    ctx.stroke();

    // Glowing follower mass at curve tip
    ctx.fillStyle = PAL.cream;
    ctx.beginPath();
    ctx.arc(tipX, tipY, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = PAL.accent;
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.fillStyle = PAL.cream;
    ctx.font = "700 18px 'JetBrainsMono', monospace";
    ctx.fillText(`ω = 16.0  ζ = 0.42 (UNDERDAMPED OVERSHOOT)`, 96, 485);
    ctx.textAlign = 'right';
    ctx.fillText(`LIVE EVAL: ${((gy0 - tipY) / (gy0 - gy1)).toFixed(4)}`, 1390, 485);
    ctx.restore();

    drawHUD(ctx, t, 3, 'KINETIC_TRIPLET // 01_SPRING_PHYSICS', PAL.ink);

  } else if (lt < twoBeats * 2) {
    // --- 3B: 3D WIREFRAME & SHADER PROJECTION ON INK ---
    const st = lt - twoBeats;
    ctx.fillStyle = PAL.ink;
    ctx.fillRect(0, 0, 1920, 1080);

    // Outline repeated pattern background
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 79, 26, 0.14)';
    ctx.lineWidth = 1.5;
    ctx.font = "900 120px 'ArchivoBlack', sans-serif";
    ctx.textAlign = 'center';
    for (let row = 0; row < 6; row++) {
      const shift = (row % 2 === 0 ? 1 : -1) * st * 220;
      ctx.strokeText('MAT4 × VERTEX × PROJECTION', 960 + shift, 150 + row * 175);
    }
    ctx.restore();

    // Center rotating 3D procedural sphere/mesh
    const enter = spring(st, 22, 0.68);
    const radius = 290 * enter;
    const rotY = st * 2.8 + 0.6;
    const rotX = 0.45 + st * 1.1;

    ctx.save();
    ctx.translate(960, 560);
    const proj = meshVerts.map(([vx, vy, vz]) => {
      // Morph slight wave along latitude
      const m = 1 + 0.14 * Math.sin(vy * 6 + st * 14);
      let x = vx * m, y = vy * m, z = vz * m;
      // Rotate Y
      let x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
      let z1 = x * Math.sin(rotY) + z * Math.cos(rotY);
      // Rotate X
      let y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
      let z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);
      const persp = 3.2 / (3.2 - z2);
      return [x1 * radius * persp, y2 * radius * persp, z2];
    });

    ctx.lineWidth = 2;
    meshEdges.forEach(([i, j]) => {
      const a = proj[i], b = proj[j];
      const depth = (a[2] + b[2]) * 0.5;
      if (depth > -0.6) {
        ctx.strokeStyle = depth > 0.2 ? PAL.accent : 'rgba(237,235,228,0.35)';
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.stroke();
      }
    });
    ctx.restore();

    // Headline overlay
    ctx.save();
    ctx.translate(960, 175);
    ctx.fillStyle = PAL.cream;
    ctx.font = "900 116px 'ArchivoBlack', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText('02 / 3D GEOMETRY', 0, 0);
    ctx.fillStyle = PAL.accent;
    ctx.font = "700 22px 'JetBrainsMono', 'PingFang SC', monospace";
    ctx.fillText('CUSTOM PERSPECTIVE MATRIX  ·  手写三维透视投影与网格变形', 0, 56);
    ctx.restore();

    drawHUD(ctx, t, 3, 'KINETIC_TRIPLET // 02_3D_PROJECTION', PAL.cream);

  } else {
    // --- 3C: 48,000 Hz WEB AUDIO SYNTH ON ELECTRIC BLUE ---
    const st = lt - twoBeats * 2;
    const collapseP = easeInQuart(seg(st, twoBeats - 0.22, twoBeats));
    ctx.fillStyle = PAL.blue;
    ctx.fillRect(0, 0, 1920, 1080);
    drawGrid(ctx, 'rgba(255,255,255,0.08)', 64, 0, 0);

    const enter = spring(st, 22, 0.68);
    ctx.save();
    ctx.translate(960, 210 + (1 - enter) * -60);
    ctx.fillStyle = PAL.white;
    ctx.font = "900 118px 'ArchivoBlack', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText('03 / 48kHz SYNTH', 0, 0);
    ctx.font = "700 22px 'JetBrainsMono', 'PingFang SC', monospace";
    ctx.fillStyle = PAL.cream;
    ctx.fillText('OFFLINE AUDIO CONTEXT  ·  代码直接合成鼓组、低音与琶音音轨', 0, 56);
    ctx.restore();

    // 32-band radial + bar visualizer around center
    ctx.save();
    ctx.translate(960, 600);
    const bars = 36;
    for (let i = 0; i < bars; i++) {
      const norm = (i - bars / 2) / (bars / 2);
      const h = (40 + 240 * Math.abs(Math.sin(i * 0.45 - st * 18)) * Math.cos(norm * 1.2)) * enter * (1 - collapseP * 0.8);
      const x = (i - bars / 2) * 38 + 19;
      ctx.fillStyle = i % 4 === 0 ? PAL.accent : PAL.white;
      roundRect(ctx, x - 12, -h, 24, h * 2, 8);
      ctx.fill();
    }
    ctx.restore();

    // Transition morph: dark portal iris opens from center at end of beat 14 to reveal 3D Voxel scene
    if (collapseP > 0) {
      ctx.fillStyle = PAL.ink;
      ctx.beginPath();
      ctx.arc(960, 540, collapseP * 1250, 0, Math.PI * 2);
      ctx.fill();
    }

    drawHUD(ctx, t, 3, 'KINETIC_TRIPLET // 03_PROCEDURAL_AUDIO', PAL.white);
  }
}

// ============================================================================
// SCENE 04 (6.5625s - 9.375s): SIGNATURE VISUAL — 3D PERSPECTIVE VOXEL WAVE
// ============================================================================
function renderScene04(ctx, t) {
  const lt = t - 6.5625; // 0 .. 2.8125 (6 beats)
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(0, 0, 1920, 1080);
  drawGrid(ctx, 'rgba(47,71,255,0.08)', 80, 0, 0);

  // Smooth orbital camera driven by lt
  const yaw = -0.62 + lt * 0.34;
  const pitch = 0.46 + 0.07 * Math.sin(lt * 2.2);
  const camScale = spring(lt + 0.05, 14, 0.78);

  // Build 11x11 3D voxel columns and sort back-to-front (Painter's algorithm)
  const N = 11;
  const spacing = 72;
  const cubes = [];
  const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
  const cosP = Math.cos(pitch), sinP = Math.sin(pitch);

  for (let gx = -5; gx <= 5; gx++) {
    for (let gz = -5; gz <= 5; gz++) {
      const dist = Math.hypot(gx, gz);
      const wave = Math.sin(dist * 0.85 - lt * 7.5) + 0.5 * Math.cos(gx * 0.6 + lt * 5.0);
      const h = (85 + (wave + 1.5) * 78) * camScale;
      const wx = gx * spacing;
      const wz = gz * spacing;
      // Depth in camera space for sorting
      const rx = wx * cosY - wz * sinY;
      const rz = wx * sinY + wz * cosY;
      const depth = rz * cosP;
      cubes.push({ gx, gz, wx, wz, h, wave, depth });
    }
  }
  cubes.sort((a, b) => a.depth - b.depth);

  const project3D = (x, y, z) => {
    const rx = x * cosY - z * sinY;
    const rz = x * sinY + z * cosY;
    const ry = y * cosP - rz * sinP;
    const rz2 = y * sinP + rz * cosP;
    const fov = 1150 / (1150 + rz2 + 220);
    return [960 + rx * fov, 675 - ry * fov, fov];
  };

  // Draw each 3D column (top face, left face, right face)
  const half = spacing * 0.41;
  cubes.forEach(c => {
    const { wx, wz, h, wave } = c;
    const p00 = project3D(wx - half, h, wz - half);
    const p10 = project3D(wx + half, h, wz - half);
    const p11 = project3D(wx + half, h, wz + half);
    const p01 = project3D(wx - half, h, wz + half);

    const b00 = project3D(wx - half, 0, wz - half);
    const b10 = project3D(wx + half, 0, wz - half);
    const b11 = project3D(wx + half, 0, wz + half);
    const b01 = project3D(wx - half, 0, wz + half);

    const isPeak = wave > 0.72;
    const isMid = wave > 0.0;

    // Left/Front faces
    ctx.fillStyle = isPeak ? '#CC370A' : (isMid ? '#1C2CB8' : '#151722');
    ctx.beginPath();
    ctx.moveTo(p01[0], p01[1]); ctx.lineTo(p11[0], p11[1]);
    ctx.lineTo(b11[0], b11[1]); ctx.lineTo(b01[0], b01[1]);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = isPeak ? '#9E2804' : (isMid ? '#121D84' : '#0E1018');
    ctx.beginPath();
    ctx.moveTo(p10[0], p10[1]); ctx.lineTo(p11[0], p11[1]);
    ctx.lineTo(b11[0], b11[1]); ctx.lineTo(b10[0], b10[1]);
    ctx.closePath();
    ctx.fill();

    // Top face
    ctx.fillStyle = isPeak ? PAL.accent : (isMid ? PAL.blue : '#25293A');
    ctx.strokeStyle = isPeak ? PAL.cream : 'rgba(237,235,228,0.22)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(p00[0], p00[1]); ctx.lineTo(p10[0], p10[1]);
    ctx.lineTo(p11[0], p11[1]); ctx.lineTo(p01[0], p01[1]);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  // Top header title & mathematical formula
  ctx.save();
  ctx.translate(960, 145);
  ctx.fillStyle = PAL.cream;
  ctx.font = "900 84px 'ArchivoBlack', sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText('REAL-TIME 3D VOXEL FIELD', 0, 0);
  ctx.fillStyle = PAL.accent;
  ctx.font = "700 20px 'JetBrainsMono', 'PingFang SC', monospace";
  ctx.fillText('121 PRISMS  ·  PAINTERS DEPTH SORT  ·  纯 Canvas 2D 矩阵透视渲染', 0, 52);
  ctx.restore();

  drawHUD(ctx, t, 4, 'SIGNATURE_VISUAL // 3D_VOXEL_PROJECTION', PAL.cream);
}

// ============================================================================
// SCENE 05 (9.375s - 11.71875s): COMPILER MICRO-MOMENT (LIVE CODE -> 60 FPS MP4)
// ============================================================================
function renderScene05(ctx, t) {
  const lt = t - 9.375; // 0 .. 2.34375 (5 beats)
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(0, 0, 1920, 1080);
  drawGrid(ctx, 'rgba(237,235,228,0.05)', 72, 0, 0);

  const cardEnter = spring(lt, 16, 0.74);

  // Two stacked ghost cards behind the main studio window
  for (let g = 2; g >= 1; g--) {
    ctx.save();
    ctx.translate(960 + g * 26, 540 - g * 22 + (1 - cardEnter) * 140);
    ctx.scale(1 - g * 0.04, 1 - g * 0.04);
    ctx.fillStyle = `rgba(47, 71, 255, ${0.14 / g})`;
    ctx.strokeStyle = `rgba(237, 235, 228, ${0.18 / g})`;
    ctx.lineWidth = 1.5;
    roundRect(ctx, -680, -340, 1360, 680, 24);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Main floating UI window
  ctx.save();
  ctx.translate(960, 550 + (1 - cardEnter) * 120);
  ctx.fillStyle = '#12131C';
  ctx.strokeStyle = 'rgba(237,235,228,0.28)';
  ctx.lineWidth = 2;
  roundRect(ctx, -680, -340, 1360, 680, 24);
  ctx.fill();
  ctx.stroke();

  // Window header bar
  ctx.fillStyle = '#1B1D2B';
  roundRect(ctx, -680, -340, 1360, 58, [24, 24, 0, 0]);
  ctx.fill();

  // Window traffic dots
  ['#FF5F56', '#FFBD2E', '#27C93F'].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(-635 + i * 26, -311, 7, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = PAL.cream;
  ctx.font = "700 16px 'JetBrainsMono', monospace";
  ctx.textAlign = 'left';
  ctx.fillText('argon-render-pipeline // pure-code-demo-15s.html -> MP4', -540, -317);

  // Left pane: Live syntax-highlighted code
  const codeLines = [
    "window.VIDEO = { w: 1920, h: 1080, duration: 15.0 };",
    "window.seek = (t) => {",
    "  const beat = Math.floor(t / 0.46875);",
    "  renderVoxelMatrix(ctx, t, spring(t, 18, 0.72));",
    "  renderKineticTypography(ctx, t, beat);",
    "  drawViewfinderHUD(ctx, t, '60_FPS_LOCKED');",
    "};",
    "window.buildAudio = async (OfflineAudioContext) => {",
    "  synthesize128BpmTrack(OfflineAudioContext);",
    "};"
  ];
  const visibleChars = Math.floor(clamp(lt / 1.1) * 420);
  let rem = visibleChars;

  ctx.font = "500 18px 'JetBrainsMono', monospace";
  codeLines.forEach((line, idx) => {
    const slice = line.slice(0, Math.max(0, rem));
    rem -= line.length;
    const y = -230 + idx * 44;
    ctx.fillStyle = 'rgba(237,235,228,0.28)';
    ctx.fillText(String(idx + 1).padStart(2, '0'), -635, y);
    ctx.fillStyle = idx === 1 || idx === 7 ? PAL.accent : (idx % 2 === 0 ? PAL.cream : '#8AB4FF');
    ctx.fillText(slice, -585, y);
  });

  // Right divider & Render Control Panel
  ctx.strokeStyle = 'rgba(237,235,228,0.12)';
  ctx.beginPath();
  ctx.moveTo(110, -282);
  ctx.lineTo(110, 340);
  ctx.stroke();

  // Right panel status & progress bar
  const clickTime = 0.85;
  const clicked = lt >= clickTime;
  const prog = easeOutQuart(seg(lt, clickTime, 1.75));
  const isDone = prog >= 0.99;

  ctx.fillStyle = PAL.muted;
  ctx.font = "700 15px 'JetBrainsMono', 'PingFang SC', monospace";
  ctx.fillText('PIPELINE TELEMETRY // 渲染管线状态', 160, -230);

  // Progress bar track
  ctx.fillStyle = '#0B0B10';
  roundRect(ctx, 160, -175, 460, 36, 10);
  ctx.fill();
  ctx.fillStyle = isDone ? '#27C93F' : PAL.accent;
  roundRect(ctx, 160, -175, 460 * prog, 36, 10);
  ctx.fill();

  ctx.fillStyle = PAL.cream;
  ctx.font = "700 22px 'JetBrainsMono', monospace";
  ctx.fillText(`RENDER PROGRESS: ${Math.round(prog * 100)}%`, 160, -105);
  ctx.font = "500 17px 'JetBrainsMono', 'PingFang SC', monospace";
  ctx.fillStyle = 'rgba(237,235,228,0.75)';
  ctx.fillText('· 生图大模型调用: 0 次 (PURE CODE)', 160, -52);
  ctx.fillText('· 帧率与快门: 60 FPS / 180° SHUTTER', 160, -14);
  ctx.fillText('· 音轨响度标准: -16.0 LUFS AAC', 160, 24);

  // Main action button
  const btnScale = clicked ? 1 - 0.08 * Math.exp(-18 * (lt - clickTime)) : 1;
  ctx.save();
  ctx.translate(390, 155);
  ctx.scale(btnScale, btnScale);
  ctx.fillStyle = isDone ? '#27C93F' : (clicked ? PAL.blue : PAL.accent);
  roundRect(ctx, -230, -42, 460, 84, 16);
  ctx.fill();
  ctx.fillStyle = isDone ? PAL.ink : PAL.white;
  ctx.font = "900 28px 'ArchivoBlack', 'PingFang SC', sans-serif";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(isDone ? 'MP4 VERIFIED ✓' : (clicked ? 'COMPILING FRAMES...' : 'COMPILE 60 FPS'), 0, 2);
  ctx.restore();

  // Toast notification sliding in at top right when done
  if (lt > 1.45) {
    const tp = spring(lt - 1.45, 20, 0.7);
    ctx.save();
    ctx.translate(435 + (1 - tp) * 220, -311);
    ctx.fillStyle = PAL.cream;
    roundRect(ctx, -215, -20, 430, 40, 999);
    ctx.fill();
    ctx.fillStyle = PAL.ink;
    ctx.font = "700 16px 'JetBrainsMono', 'PingFang SC', monospace";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✓ 900 FRAMES + SYNTH AUDIO READY', 0, 0);
    ctx.restore();
  }

  // Animated vector cursor moving to click the button
  const curP = ease(seg(lt, 0.1, clickTime));
  const curX = lerp(640, 420, curP);
  const curY = lerp(310, 165, curP);
  ctx.save();
  ctx.translate(curX, curY);
  ctx.fillStyle = PAL.white;
  ctx.strokeStyle = PAL.ink;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 34);
  ctx.lineTo(10, 25);
  ctx.lineTo(20, 40);
  ctx.lineTo(27, 36);
  ctx.lineTo(17, 21);
  ctx.lineTo(29, 21);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  ctx.restore();

  drawHUD(ctx, t, 5, 'PRODUCT_PIPELINE // PLAYWRIGHT_FFMPEG', PAL.cream);
}

// ============================================================================
// SCENE 06 (11.71875s - 13.125s): TELEMETRY PROOF -> SINGULARITY COLLAPSE
// ============================================================================
function renderScene06(ctx, t) {
  const lt = t - 11.71875; // 0 .. 1.40625 (3 beats)
  const collapseP = easeInQuart(seg(lt, 1.05, 1.40625));

  ctx.fillStyle = PAL.cream;
  ctx.fillRect(0, 0, 1920, 1080);
  drawGrid(ctx, 'rgba(11,11,16,0.07)', 80, 0, 0);

  const cards = [
    { x: 370, y: 540, w: 520, h: 620, bg: PAL.ink, fg: PAL.cream, accent: PAL.accent,
      num: Math.round(lerp(0, 900, easeOutQuart(seg(lt, 0.05, 0.85)))),
      unit: 'FRAMES @ 60 FPS', sub: '15.00 秒逐帧确定性渲染' },
    { x: 960, y: 540, w: 520, h: 620, bg: PAL.accent, fg: PAL.ink, accent: PAL.cream,
      num: '0',
      unit: 'AI IMAGE MODELS', sub: '零生图大模型 · 100% 纯代码绘制' },
    { x: 1550, y: 540, w: 520, h: 620, bg: PAL.blue, fg: PAL.white, accent: PAL.cream,
      num: '100%',
      unit: 'REPRODUCIBLE', sub: '单文件 HTML 随时拖拽时间轴预览' }
  ];

  cards.forEach((c, idx) => {
    const cp = spring(lt - idx * 0.09, 20, 0.72);
    const cx = lerp(c.x, 960, collapseP);
    const cy = lerp(c.y + (1 - cp) * 140, 540, collapseP);
    const scale = cp * (1 - collapseP * 0.95);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.fillStyle = c.bg;
    roundRect(ctx, -c.w / 2, -c.h / 2, c.w, c.h, 28);
    ctx.fill();

    ctx.fillStyle = c.fg;
    ctx.font = "900 138px 'ArchivoBlack', sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(c.num), 0, -45);

    ctx.fillStyle = c.accent;
    ctx.font = "700 24px 'JetBrainsMono', monospace";
    ctx.fillText(c.unit, 0, 95);

    ctx.fillStyle = c.fg;
    ctx.font = "500 22px 'PingFang SC', sans-serif";
    ctx.fillText(c.sub, 0, 155);
    ctx.restore();
  });

  // Implosion transition into dark end card
  if (collapseP > 0.05) {
    ctx.fillStyle = PAL.ink;
    ctx.beginPath();
    ctx.arc(960, 540, collapseP * 1300, 0, Math.PI * 2);
    ctx.fill();

    // Glowing accent singularity dot at center
    ctx.fillStyle = PAL.accent;
    ctx.beginPath();
    ctx.arc(960, 540, lerp(60, 18, collapseP), 0, Math.PI * 2);
    ctx.fill();
  }

  drawHUD(ctx, t, 6, 'TELEMETRY_PROOF // DETERMINISTIC_OUTPUT', collapseP > 0.5 ? PAL.cream : PAL.ink);
}

// ============================================================================
// SCENE 07 (13.125s - 15.000s): END CARD (HOLD + RING PULSE + LOGO DOT)
// ============================================================================
function renderScene07(ctx, t) {
  const lt = t - 13.125; // 0 .. 1.875 (4 beats)
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(0, 0, 1920, 1080);
  drawGrid(ctx, 'rgba(237,235,228,0.04)', 80, 0, 0);

  // Expanding shockwave rings from the singularity dot
  for (let r = 0; r < 3; r++) {
    const rp = clamp((lt - r * 0.12) / 1.35);
    if (rp > 0) {
      ctx.strokeStyle = `rgba(255, 79, 26, ${(1 - rp) * 0.5})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(960, 460, easeOutQuart(rp) * 760, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  const slam = spring(lt - 0.05, 16, 0.74);

  // Main brand lockup: ARGON . CODE
  ctx.save();
  ctx.translate(1002, 445 + (1 - slam) * 40);
  ctx.globalAlpha = clamp(slam);

  ctx.fillStyle = PAL.cream;
  ctx.font = "900 156px 'ArchivoBlack', sans-serif";
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('ARGON', -42, 0);

  // The carried accent dot in the center!
  const dotPulse = 1 + 0.12 * Math.sin(lt * 14) * Math.exp(-lt * 1.5);
  ctx.fillStyle = PAL.accent;
  ctx.beginPath();
  ctx.arc(0, 12, 22 * dotPulse, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = PAL.cream;
  ctx.textAlign = 'left';
  ctx.fillText('CODE', 42, 0);
  ctx.restore();

  // Italic serif tagline
  const tagP = spring(lt - 0.22, 14, 0.8);
  ctx.save();
  ctx.globalAlpha = clamp(tagP);
  ctx.translate(960, 595 + (1 - tagP) * 24);
  ctx.fillStyle = PAL.cream;
  ctx.font = "italic 52px 'InstrumentSerif', serif";
  ctx.textAlign = 'center';
  ctx.fillText('Pure mathematics, physics & sound — compiled to 60fps video.', 0, 0);

  ctx.fillStyle = PAL.accent;
  ctx.font = "600 26px 'PingFang SC', 'Hiragino Sans GB', sans-serif";
  ctx.fillText('纯代码生成动效短片 · 零生图大模型 · 每一帧皆可精确复现', 0, 56);
  ctx.restore();

  // Hairline rule
  ctx.strokeStyle = 'rgba(237,235,228,0.22)';
  ctx.lineWidth = 1.5;
  const lineW = 760 * easeOutQuart(seg(lt, 0.25, 0.9));
  ctx.beginPath();
  ctx.moveTo(960 - lineW, 710);
  ctx.lineTo(960 + lineW, 710);
  ctx.stroke();

  // Typed mono footer line
  const fullMono = 'HTML5 + CANVAS + WEBAUDIO + PLAYWRIGHT + FFMPEG // READY FOR YOUR BRIEF';
  const chars = Math.floor(clamp((lt - 0.3) / 0.95) * fullMono.length);
  const caret = Math.floor(t * 8) % 2 === 0 ? ' █' : '  ';
  ctx.fillStyle = PAL.cream;
  ctx.font = "700 18px 'JetBrainsMono', monospace";
  ctx.textAlign = 'center';
  ctx.fillText(fullMono.slice(0, chars) + caret, 960, 760);

  drawHUD(ctx, t, 7, 'END_CARD // ARGON_CODE_STUDIO', PAL.cream);
}

// ============================================================================
// MASTER PURE SEEK(t) FUNCTION
// ============================================================================
window.seek = function(t) {
  t = clamp(t, 0, window.VIDEO.duration);
  ctx.clearRect(0, 0, 1920, 1080);

  if (t < 1.875) {
    renderScene01(ctx, t);
    drawPostProcess(ctx, t, true);
  } else if (t < 3.75) {
    renderScene02(ctx, t);
    drawPostProcess(ctx, t, true);
  } else if (t < 6.5625) {
    renderScene03(ctx, t);
    drawPostProcess(ctx, t, false);
  } else if (t < 9.375) {
    renderScene04(ctx, t);
    drawPostProcess(ctx, t, true);
  } else if (t < 11.71875) {
    renderScene05(ctx, t);
    drawPostProcess(ctx, t, true);
  } else if (t < 13.125) {
    renderScene06(ctx, t);
    drawPostProcess(ctx, t, false);
  } else {
    renderScene07(ctx, t);
    drawPostProcess(ctx, t, true);
  }
};

// ============================================================================
// PROCEDURAL SOUNDTRACK SYNTHESIS (128 BPM, OfflineAudioContext / AudioContext)
// ============================================================================
window.buildAudio = async function(ac) {
  const sr = ac.sampleRate;
  const dur = window.VIDEO.duration;

  // Seeded noise buffer for drums, risers, and whooshes
  const noiseBuf = ac.createBuffer(2, sr * 4, sr);
  for (let ch = 0; ch < 2; ch++) {
    const data = noiseBuf.getChannelData(ch);
    const r = rng(9001 + ch * 1337);
    for (let i = 0; i < data.length; i++) data[i] = r() * 2 - 1;
  }

  // Master compressor to glue the mix
  const master = ac.createDynamicsCompressor();
  master.threshold.value = -14;
  master.knee.value = 12;
  master.ratio.value = 4;
  master.attack.value = 0.003;
  master.release.value = 0.15;
  master.connect(ac.destination);

  const playKick = (time, punch = 1.0) => {
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(145 * punch, time);
    osc.frequency.exponentialRampToValueAtTime(42, time + 0.08);
    osc.frequency.exponentialRampToValueAtTime(28, time + 0.28);

    gain.gain.setValueAtTime(0.001, time);
    gain.gain.linearRampToValueAtTime(0.85 * punch, time + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.30);

    osc.connect(gain);
    gain.connect(master);
    osc.start(time);
    osc.stop(time + 0.32);
  };

  const playClap = (time, amp = 0.42) => {
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1450;
    bp.Q.value = 1.4;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.001, time);
    gain.gain.linearRampToValueAtTime(amp, time + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.16);
    src.connect(bp);
    bp.connect(gain);
    gain.connect(master);
    src.start(time);
    src.stop(time + 0.18);
  };

  const playHat = (time, open = false) => {
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const hp = ac.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 7500;
    const gain = ac.createGain();
    const decay = open ? 0.14 : 0.04;
    gain.gain.setValueAtTime(open ? 0.18 : 0.11, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + decay);
    src.connect(hp);
    hp.connect(gain);
    gain.connect(master);
    src.start(time);
    src.stop(time + decay + 0.01);
  };

  const playBass = (time, freq, len) => {
    const osc = ac.createOscillator();
    const sub = ac.createOscillator();
    const lp = ac.createBiquadFilter();
    const gain = ac.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, time);
    sub.type = 'sine';
    sub.frequency.setValueAtTime(freq * 0.5, time);

    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(720, time);
    lp.frequency.exponentialRampToValueAtTime(190, time + len * 0.85);

    gain.gain.setValueAtTime(0.001, time);
    gain.gain.linearRampToValueAtTime(0.34, time + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, time + len);

    osc.connect(lp);
    sub.connect(lp);
    lp.connect(gain);
    gain.connect(master);
    osc.start(time);
    sub.start(time);
    osc.stop(time + len + 0.02);
    sub.stop(time + len + 0.02);
  };

  const playPluck = (time, freq, dur = 0.18, amp = 0.18) => {
    const osc = ac.createOscillator();
    const lp = ac.createBiquadFilter();
    const gain = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(freq * 4, time);
    lp.frequency.exponentialRampToValueAtTime(freq * 1.2, time + dur);
    gain.gain.setValueAtTime(0.001, time);
    gain.gain.linearRampToValueAtTime(amp, time + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
    osc.connect(lp);
    lp.connect(gain);
    gain.connect(master);
    osc.start(time);
    osc.stop(time + dur + 0.02);
  };

  const playWhoosh = (time, dur = 0.42, startF = 240, endF = 1800, amp = 0.32) => {
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 2.2;
    bp.frequency.setValueAtTime(startF, time);
    bp.frequency.exponentialRampToValueAtTime(endF, time + dur);
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.001, time);
    gain.gain.linearRampToValueAtTime(amp, time + dur * 0.6);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
    src.connect(bp);
    bp.connect(gain);
    gain.connect(master);
    src.start(time);
    src.stop(time + dur + 0.02);
  };

  // Schedule 32 beats (0..31) across 15.0s
  // Root progression in F minor (F2=87.31, Db2=69.30, Ab2=103.83, Eb2=77.78)
  const roots = [87.31, 69.30, 103.83, 77.78];
  const arpScale = [1, 1.1892, 1.4983, 2, 2.3784, 2.9966]; // minor pentatonic intervals

  for (let b = 0; b < 32; b++) {
    const bt = b * BEAT;
    // Kick on every beat (until beat 29 where the final chord rings out)
    if (b <= 28) {
      playKick(bt, b % 4 === 0 ? 1.12 : 0.92);
      if (b % 2 === 1) playClap(bt, 0.38);
      // 16th-note hats & arp
      for (let s = 0; s < 4; s++) {
        const st = bt + s * (BEAT / 4);
        if (b >= 4 && s % 2 === 1) playHat(st, s === 3 && b % 4 === 3);
        if (b >= 4) {
          const root = roots[Math.floor(b / 4) % roots.length];
          const mult = arpScale[(b * 4 + s) % arpScale.length];
          playPluck(st, root * 2 * mult, 0.14, 0.14);
        }
      }
      // Sub-bass on eighth notes
      const root = roots[Math.floor(b / 4) % roots.length];
      playBass(bt, root, BEAT * 0.45);
      playBass(bt + BEAT * 0.5, root, BEAT * 0.45);
    }
  }

  // Transition risers, impacts & UI sound effects synced to exact scene changes
  playWhoosh(0.05, 0.40, 300, 1600, 0.26);         // Spark ignition
  playWhoosh(1.40, 0.47, 220, 2400, 0.42);         // Flood riser into Scene 02
  playKick(1.875, 1.3);                            // Brand slam impact
  playWhoosh(3.35, 0.40, 400, 2200, 0.35);         // Dot detach into Scene 03
  playWhoosh(4.65, 0.22, 600, 1800, 0.28);         // Swap 3A -> 3B
  playWhoosh(5.58, 0.22, 600, 1800, 0.28);         // Swap 3B -> 3C
  playWhoosh(6.30, 0.30, 300, 2000, 0.38);         // Portal into Scene 04 (3D Voxel)
  playWhoosh(9.15, 0.26, 1600, 380, 0.34);         // Transition into Scene 05 (Compiler)
  playPluck(9.375 + 0.85, 1046.5, 0.12, 0.35);     // Cursor click C6 blip
  playPluck(9.375 + 1.45, 1318.5, 0.22, 0.32);     // Toast chime E6
  playPluck(9.375 + 1.53, 1567.98, 0.30, 0.32);    // Toast chime G6
  playWhoosh(12.75, 0.38, 250, 2800, 0.45);        // Singularity collapse into End Card

  // Finale warm chord pad at 13.125s (F minor 9th: F2, C3, Ab3, C4, G4)
  const chordTime = 13.125;
  playKick(chordTime, 1.35);
  [87.31, 130.81, 207.65, 261.63, 392.00, 523.25].forEach((f, idx) => {
    const osc = ac.createOscillator();
    const lp = ac.createBiquadFilter();
    const gain = ac.createGain();
    osc.type = idx < 2 ? 'sawtooth' : 'triangle';
    osc.frequency.setValueAtTime(f, chordTime);
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1800, chordTime);
    lp.frequency.exponentialRampToValueAtTime(420, dur);
    gain.gain.setValueAtTime(0.001, chordTime);
    gain.gain.linearRampToValueAtTime(0.11, chordTime + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0008, dur - 0.02);
    osc.connect(lp);
    lp.connect(gain);
    gain.connect(master);
    osc.start(chordTime);
    osc.stop(dur);
  });
};

// --- LIVE PREVIEW SCRUBBER & PLAYBACK ---
if (!isRender) {
  let buf = null, ac = null, src = null, startAt = 0, offset = 0, playing = false;
  const scrub = document.getElementById('scrub');
  const timeLabel = document.getElementById('time-label');
  const playBtn = document.getElementById('play-btn');

  async function play() {
    ac ??= new (window.AudioContext || window.webkitAudioContext)();
    if (!buf) {
      const off = new OfflineAudioContext(2, Math.ceil(48000 * window.VIDEO.duration), 48000);
      await window.buildAudio(off);
      buf = await off.startRendering();
    }
    src = ac.createBufferSource();
    src.buffer = buf;
    src.connect(ac.destination);
    src.start(0, offset % window.VIDEO.duration);
    startAt = ac.currentTime;
    playing = true;
  }
  function pause() {
    if (!playing) return;
    offset = (offset + ac.currentTime - startAt) % window.VIDEO.duration;
    try { src.stop(); } catch (e) {}
    playing = false;
  }
  function now() {
    return playing ? (offset + ac.currentTime - startAt) % window.VIDEO.duration : offset;
  }
  playBtn.addEventListener('click', () => {
    if (playing) pause();
    else play();
  });
  scrub.addEventListener('input', (e) => {
    const wasPlaying = playing;
    if (wasPlaying) pause();
    offset = parseFloat(e.target.value);
    window.seek(offset);
    timeLabel.textContent = `${offset.toFixed(2).padStart(5, '0')}s / 15.00s`;
  });
  (function loop() {
    const t = now();
    window.seek(t);
    if (playing) {
      scrub.value = t.toFixed(2);
      timeLabel.textContent = `${t.toFixed(2).padStart(5, '0')}s / 15.00s`;
    }
    requestAnimationFrame(loop);
  })();
} else {
  window.seek(0);
}
